name: One-shot update Switch install guide

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot update Switch install guide v3'
    runs-on: ubuntu-latest
    steps:
      - name: Update Switch installation section in v1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/releases/379471357 > release.json
          python - <<'PY'
          import json
          with open('release.json', encoding='utf-8') as f:
              r = json.load(f)
          body = (r.get('body') or '').replace('\r\n','\n').replace('\r','\n')
          start = body.index('### Switch 실기 — Atmosphere')
          end_marker = '\n---\n\n## 다운로드 파일'
          end = body.index(end_marker, start)
          new_section = '''### Switch 실기 — Atmosphere

          > [!IMPORTANT]
          > ## Switch 설치는 폴더 2개를 각각 다른 위치에 복사합니다
          >
          > 패처 실행이 끝나면 **Switch·Android용 결과 폴더** 안에 있는 아래 두 폴더를 사용합니다.
          >
          > ```text
          > 01008BA00F172000
          > atmosphere
          > ```
          >
          > **`01008BA00F172000` 폴더와 `atmosphere` 폴더는 복사 위치가 서로 다릅니다.**

          ### 1단계 — `01008BA00F172000` 폴더 복사

          결과물의 **`01008BA00F172000` 폴더를 통째로** 아래 위치에 복사합니다.

          ```text
          SD:/atmosphere/contents/
          ```

          복사가 끝나면 아래처럼 되어 있어야 합니다.

          ```text
          SD카드
          └─ atmosphere
             └─ contents
                └─ 01008BA00F172000
                   └─ romfs
          ```

          ### 2단계 — `atmosphere` 폴더 복사

          결과물의 **`atmosphere` 폴더를 SD카드 최상위(루트)에 복사**합니다.

          ```text
          SD:/
          ```

          이미 SD카드에 `atmosphere` 폴더가 있다면 **기존 폴더와 병합해서 복사**하면 됩니다.

          이 폴더에는 리버스 테러용 `exefs_patches`가 포함되어 있으므로, `01008BA00F172000` 폴더만 복사하고 끝내면 안 됩니다.

          ### 3단계 — Switch 완전 재부팅

          두 폴더를 모두 복사했으면 SD카드를 Switch에 넣고 **본체를 완전히 재부팅**한 뒤 게임을 실행합니다.

          > [!WARNING]
          > - `01008BA00F172000` 폴더를 SD카드 루트에 바로 넣으면 안 됩니다.
          > - `atmosphere` 폴더를 `contents` 안에 넣으면 안 됩니다.
          > - `01008BA00F172000`은 반드시 `SD:/atmosphere/contents/` 아래에 있어야 합니다.
          > - 결과물의 `atmosphere` 폴더도 반드시 SD카드 루트에 병합 복사해야 합니다.

          최종적으로 아래 두 경로가 존재해야 합니다.

          ```text
          SD:/atmosphere/contents/01008BA00F172000/romfs

          SD:/atmosphere/exefs_patches/EVE-Rebirth-Terror-KR-v1.3.0/
          └─ 5841D3A4F38CF54DC99E54F137776FF530D2EFF2000000000000000000000000.ips
          ```

          정리하면 아래 두 줄만 기억하면 됩니다.

          ```text
          01008BA00F172000  →  SD:/atmosphere/contents/
          atmosphere        →  SD:/
          ```'''
          new_section = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_section.splitlines())
          body = body[:start] + new_section + body[end:]
          with open('payload.json','w',encoding='utf-8') as f:
              json.dump({'body': body}, f, ensure_ascii=False)
          PY
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379471357 --input payload.json
          gh api repos/${GITHUB_REPOSITORY}/releases/379471357 > verify.json
          python - <<'PY'
          import json
          with open('verify.json', encoding='utf-8') as f:
              r = json.load(f)
          body = r.get('body') or ''
          assert 'Switch 설치는 폴더 2개를 각각 다른 위치에 복사합니다' in body
          assert '01008BA00F172000  →  SD:/atmosphere/contents/' in body
          assert 'atmosphere        →  SD:/' in body
          assert '5841D3A4F38CF54DC99E54F137776FF530D2EFF2000000000000000000000000.ips' in body
          assert 'Switch 완전 재부팅' in body
          print('Switch install guide verified')
          PY
