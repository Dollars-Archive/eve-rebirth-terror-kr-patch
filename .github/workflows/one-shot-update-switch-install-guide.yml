name: One-shot update Switch install guide

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot update Switch install guide'
    runs-on: ubuntu-latest
    steps:
      - name: Update Switch installation section in v1.3.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_SECTION_B64: 
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/releases/379471357 > release.json
          python - <<'PY'
          import os, json, base64
          with open('release.json', encoding='utf-8') as f:
              r = json.load(f)
          body = (r.get('body') or '').replace('\r\n','\n').replace('\r','\n')
          start = body.index('### Switch 실기 — Atmosphere')
          end_marker = '\n---\n\n## 다운로드 파일'
          end = body.index(end_marker, start)
          new_section = base64.b64decode(os.environ['NEW_SECTION_B64']).decode('utf-8').rstrip()
          body = body[:start] + new_section + body[end:]
          with open('payload.json','w',encoding='utf-8') as f:
              json.dump({'body': body}, f, ensure_ascii=False)
          PY
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/379471357 --input payload.json
          gh api repos/${GITHUB_REPOSITORY}/releases/379471357 > verify.json
          python - <<'PY'
          import json
          with open('verify.json', encoding='utf-8') as f:
              r = json.load(f)
          body = r.get('body') or ''
          assert 'Switch 설치는 폴더 2개를 각각 다른 위치에 복사합니다' in body
          assert '01008BA00F172000  →  SD:/atmosphere/contents/' in body
          assert 'atmosphere        →  SD:/' in body
          assert '5841D3A4F38CF54DC99E54F137776FF530D2EFF2000000000000000000000000.ips' in body
          assert 'Switch 완전 재부팅' in body
          print('Switch install guide verified')
          PY
