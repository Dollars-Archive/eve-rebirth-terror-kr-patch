name: Sync install guide to Pages

on:
  push:
    branches:
      - main
    paths:
      - INSTALL.md
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync-install-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync INSTALL.md to GitHub Pages
        run: cp INSTALL.md docs/INSTALL.md

      - name: Commit synced guide
        id: sync
        shell: bash
        run: |
          if git diff --quiet -- docs/INSTALL.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Install guide is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INSTALL.md
          git commit -m "docs: sync install guide to Pages"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
