name: Sync install guide to Pages

on:
  push:
    branches:
      - main
    paths:
      - INSTALL.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-install-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync INSTALL.md to GitHub Pages
        run: cp INSTALL.md docs/INSTALL.md

      - name: Commit synced guide
        shell: bash
        run: |
          if git diff --quiet -- docs/INSTALL.md; then
            echo "Install guide is already in sync."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INSTALL.md
          git commit -m "docs: sync install guide to Pages"
          git push
