name: One-shot mark Rebirth Terror v1.3.0 reviewed

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    if: github.event.head_commit.message == 'One-shot mark Rebirth Terror v1.3.0 reviewed'
    runs-on: ubuntu-latest
    steps:
      - name: Add 검수판 to release name
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID="379471357"
          NEW_NAME="EVE rebirth terror 한국어 패치 v1.3.0 (검수판)"
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -f name="$NEW_NAME"
          VERIFY="$(gh api "repos/${REPO}/releases/${RELEASE_ID}" --jq '.name')"
          test "$VERIFY" = "$NEW_NAME"
          echo "Verified: $VERIFY"
