name: One-shot migrate Rebirth Terror release to v1.3.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-release:
    if: github.event.head_commit.message == 'One-shot migrate Rebirth Terror release to v1.3.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create v1.3.0 tag, update release, remove v1.2.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID="379471357"
          OLD_TAG="v1.2.0"
          NEW_TAG="v1.3.0"
          OLD_SHA="c67c52f1c8068dc5ff71fcb48b60fec9acd6f4ec"

          if ! git rev-parse "refs/tags/${NEW_TAG}" >/dev/null 2>&1; then
            git tag "${NEW_TAG}" "${OLD_SHA}"
          fi
          git push origin "refs/tags/${NEW_TAG}"

          RELEASE_JSON="$(gh api "repos/${REPO}/releases/${RELEASE_ID}")"
          BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')"
          NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // ""')"
          NEW_BODY="${BODY//v1.2.0/v1.3.0}"
          NEW_NAME="${NAME//v1.2.0/v1.3.0}"

          jq -n \
            --arg tag_name "$NEW_TAG" \
            --arg name "$NEW_NAME" \
            --arg body "$NEW_BODY" \
            '{tag_name:$tag_name,name:$name,body:$body}' > payload.json

          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" --input payload.json

          VERIFY="$(gh api "repos/${REPO}/releases/${RELEASE_ID}")"
          test "$(printf '%s' "$VERIFY" | jq -r '.tag_name')" = "$NEW_TAG"
          test "$(printf '%s' "$VERIFY" | jq -r '.name')" = "$NEW_NAME"
          if printf '%s' "$VERIFY" | jq -r '.body // ""' | grep -F 'v1.2.0'; then
            echo 'v1.2.0 still remains in release body.' >&2
            exit 1
          fi

          if git rev-parse "refs/tags/${OLD_TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${OLD_TAG}"
          fi

          echo 'Verified: v1.3.0 tag/release/body complete, old v1.2.0 tag removed.'
