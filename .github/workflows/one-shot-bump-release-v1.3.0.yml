name: One-shot retarget Rebirth Terror release to v1.3.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-release:
    if: github.event.head_commit.message == 'One-shot retarget Rebirth Terror release to v1.3.0'
    runs-on: ubuntu-latest
    steps:
      - name: Retarget release and replace all v1.2.0 references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY}"
          RELEASE_ID="379471357"
          OLD_TAG="v1.2.0"
          NEW_TAG="v1.3.0"

          RELEASE_JSON="$(gh api "repos/${REPO}/releases/${RELEASE_ID}")"
          BODY="$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')"
          NAME="$(printf '%s' "$RELEASE_JSON" | jq -r '.name // ""')"
          OLD_SHA="$(gh api "repos/${REPO}/git/ref/tags/${OLD_TAG}" --jq '.object.sha')"

          NEW_BODY="${BODY//v1.2.0/v1.3.0}"
          NEW_NAME="${NAME//v1.2.0/v1.3.0}"

          jq -n \
            --arg tag_name "$NEW_TAG" \
            --arg target_commitish "$OLD_SHA" \
            --arg name "$NEW_NAME" \
            --arg body "$NEW_BODY" \
            '{tag_name:$tag_name,target_commitish:$target_commitish,name:$name,body:$body}' > payload.json

          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" --input payload.json

          VERIFY="$(gh api "repos/${REPO}/releases/${RELEASE_ID}")"
          test "$(printf '%s' "$VERIFY" | jq -r '.tag_name')" = "$NEW_TAG"
          test "$(printf '%s' "$VERIFY" | jq -r '.name')" = "$NEW_NAME"
          if printf '%s' "$VERIFY" | jq -r '.body // ""' | grep -F 'v1.2.0'; then
            echo 'v1.2.0 still remains in release body.' >&2
            exit 1
          fi

          gh api "repos/${REPO}/git/ref/tags/${NEW_TAG}" >/dev/null
          echo 'Verified: release title, tag target and all body references are v1.3.0.'
