name: One-shot sample compact v1.4.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-draft:
    if: github.event.head_commit.message == 'One-shot sample compact v1.4.0 release'
    runs-on: ubuntu-latest
    steps:
      - name: Replace v1.4.0 draft body with compact release format
        env:
          GH_TOKEN: ${{ github.token }}
          BODY_B64: 
        run: |
          set -euo pipefail
          python -c "import os,base64,json; body=base64.b64decode(os.environ['BODY_B64']).decode('utf-8'); open('payload.json','w',encoding='utf-8').write(json.dumps({'body':body},ensure_ascii=False))"
          gh api --method PATCH repos/${GITHUB_REPOSITORY}/releases/386385653 --input payload.json > updated.json
          python - <<'PY'
          import json
          with open('updated.json', encoding='utf-8') as f:
              r = json.load(f)
          assert r['id'] == 386385653
          assert r['draft'] is True
          assert r['tag_name'] == 'v1.4.0'
          body = r.get('body') or ''
          assert 'INSTALL.md' in body
          assert 'v1.4.0 변경 사항' in body
          assert 'RomForge로 RomFS 준비' not in body
          assert 'Switch 설치는 폴더 2개를 각각 다른 위치에 복사합니다' not in body
          print('Compact draft release verified')
          PY
