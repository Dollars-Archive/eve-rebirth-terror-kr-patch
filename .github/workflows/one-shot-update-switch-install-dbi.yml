name: One-shot update Switch install with DBI MTP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-install:
    if: github.event.head_commit.message == 'One-shot update Switch install with DBI MTP'
    runs-on: ubuntu-latest
    steps:
      - name: Update Switch installation guide
        env:
          GH_TOKEN: ${{ github.token }}
          SECTION_B64: 
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > file.json
          python - <<'PY'
          import base64, json, os
          data = json.load(open('file.json', encoding='utf-8'))
          text = base64.b64decode(data['content']).decode('utf-8')
          start = text.index('# 6. Nintendo Switch 실기 적용 방법')
          end = text.index('---\n\n# 7. 패치가 적용되지 않을 때 확인', start)
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          text = text[:start] + section + '\n\n' + text[end:]
          old = '7. Switch 적용 후 **완전 재부팅**했는지 확인'
          new = '7. Switch에서는 게임을 완전히 종료한 뒤 다시 실행해 보고, 한글패치가 적용되지 않을 때만 **본체를 재부팅**한 뒤 다시 확인'
          assert old in text
          text = text.replace(old, new, 1)
          payload = {'message':'docs: add DBI MTP Switch install option and make reboot optional','content':base64.b64encode(text.encode('utf-8')).decode('ascii'),'sha':data['sha']}
          json.dump(payload, open('payload.json','w',encoding='utf-8'), ensure_ascii=False)
          PY
          gh api --method PUT repos/${GITHUB_REPOSITORY}/contents/INSTALL.md --input payload.json > updated.json
          gh api repos/${GITHUB_REPOSITORY}/contents/INSTALL.md > verify.json
          python - <<'PY'
          import base64, json
          data=json.load(open('verify.json',encoding='utf-8'))
          text=base64.b64decode(data['content']).decode('utf-8')
          assert 'Run MTP responder' in text
          assert '1: SD Card' in text
          assert '정상적으로 적용되면 별도 재부팅은 필요하지 않습니다.' in text
          assert 'Switch 본체를 완전히 재부팅' not in text
          print(data['sha'])
          PY
